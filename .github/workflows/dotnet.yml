name: Run Happy Flow Scenario

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-happy-flow:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run HappyFlow.feature
        run: dotnet test --no-build --filter "TestCategory=happyFlow"
