name: Run Happy Flow Scenario

on:
  push:
    branches: master
  workflow_dispatch:

jobs:
  run-happy-flow:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
          install-dir: ${{ github.workspace }}/.dotnet

      - name: Add .NET to PATH
        run: echo "${{ github.workspace }}/.dotnet" >> $env:GITHUB_PATH

      - name: Restore dependencies
        run: ${{ github.workspace }}/.dotnet/dotnet restore
