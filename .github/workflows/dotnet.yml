name: Run Happy Flow Scenario

on:
  workflow_dispatch:

jobs:
  run-happy-flow:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install .NET SDK 6 manually
        run: |
          mkdir .dotnet
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Version 6.0.414 -InstallDir "$PWD/.dotnet"
        shell: pwsh

      - name: Add .NET to PATH
        run: echo "$env:GITHUB_WORKSPACE\.dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
        shell: pwsh

      - name: Restore dependencies
        run: .\.dotnet\dotnet restore

      - name: Build the project
        run: .\.dotnet\dotnet build --no-restore --configuration Release

      - name: Run only happyFlow tests
        run: .\.dotnet\dotnet test --no-build --filter "TestCategory=happyFlow"
